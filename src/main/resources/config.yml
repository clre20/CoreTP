# ============================================================
#  CoreTP 全域設定
#  各傳送功能的設定在 modules/ 資料夾（tpa、home、warp、back、rtp 各一個檔案）
#  所有顯示文字在 messages.yml
# ============================================================

storage:
  # 資料多久批次寫入硬碟一次（秒）。玩家離線與關服時一定會存檔。
  save-interval-seconds: 60

safety:
  # 傳送到家、地標、歷史位置前，檢查落點是否會窒息或掉進岩漿
  check-destination: true

countdown:
  # 傳送倒數顯示在快捷欄上方（true）或聊天室（false）
  actionbar: true

update-checker:
  # 伺服器啟動時檢查 GitHub 是否有新版本
  check-on-startup: true
  # 有新版本時，提醒具備 coretp.version 權限的玩家（登入 3 秒後）
  notify-on-join: true

gui:
  # 箱子介面的填充物品
  filler: GRAY_STAINED_GLASS_PANE
  icons:
    homes: RED_BED
    public-homes: LIME_BED
    warps: BEACON
    players: PLAYER_HEAD
    requests: WRITABLE_BOOK
    back: RECOVERY_COMPASS
    rtp: ENDER_PEARL
    home-private: RED_BED
    home-public: LIME_BED
    warp-default: LODESTONE
    back-teleport: COMPASS
    back-death: SKELETON_SKULL
    teleport: ENDER_PEARL
    toggle-public: OAK_DOOR
    delete: BARRIER
    confirm: LIME_CONCRETE
    cancel: RED_CONCRETE
    tpa: ENDER_PEARL
    tpahere: ENDER_EYE
    previous: ARROW
    next: ARROW
    back-button: OAK_SIGN
