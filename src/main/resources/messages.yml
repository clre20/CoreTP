# ============================================================
#  CoreTP 訊息設定
#  顏色使用 & 代碼（例如 &a 綠色、&l 粗體）。
#  {大括號} 是變數，會被替換成實際內容，請保留。
#  把某一則訊息設成 "" 就不會顯示。
# ============================================================

general:
  prefix: "&8[&bCoreTP&8] "
  no-permission: "&c您沒有權限執行這個動作。"
  only-players: "&c這個指令只能由玩家在遊戲內使用。"
